<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="960" viewBox="0 0 1680 960" role="img" aria-label="Хранение и движение рукописи"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8297a4"/></marker></defs><rect width="1680" height="960" fill="#f7f8fa"/><text x="65" y="85" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#263746">Хранение и движение рукописи</text><text x="65" y="126" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#607484">Исходник, рабочие проверки и поисковые индексы разделены по ответственности</text><rect x="65" y="180" width="476" height="239" rx="16" fill="#fff" stroke="#cdd9e0"/><rect x="65" y="180" width="8" height="239" rx="4" fill="#aa7e4e"/><text x="89" y="224" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#283746">Основная SQLite · Canon</text><text x="89" y="257" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">projects (JSON автора)</text><text x="89" y="284" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">ai_jobs · ai_book_chapters</text><text x="89" y="311" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">production_jobs · production_steps</text><text x="89" y="338" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">production_artifacts (SHA, неизменяемые)</text><text x="89" y="365" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">author_text_revisions · illustrations</text><rect x="605" y="180" width="475" height="239" rx="16" fill="#fff" stroke="#cdd9e0"/><rect x="605" y="180" width="8" height="239" rx="4" fill="#647d9b"/><text x="629" y="224" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#283746">Рабочая SQLite · Work</text><text x="629" y="257" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Ревизии книги, QA и снимки</text><text x="629" y="284" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Контекст, контрольные точки</text><text x="629" y="311" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Вспомогательная память проекта</text><text x="629" y="338" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Восстанавливаемые отчёты</text><text x="629" y="365" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Не заменяет оригинал рукописи</text><rect x="1145" y="180" width="475" height="239" rx="16" fill="#fff" stroke="#cdd9e0"/><rect x="1145" y="180" width="8" height="239" rx="4" fill="#648b7d"/><text x="1169" y="224" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#283746">Поисковая SQLite · Search</text><text x="1169" y="257" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">FTS5 · индекс текста</text><text x="1169" y="284" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Семантические совпадения RAG</text><text x="1169" y="311" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Контекст по главам и сценам</text><text x="1169" y="338" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Derived index → можно пересобрать</text><text x="1169" y="365" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Не объявлять черновик каноном</text><path d="M541,310 L602,310" fill="none" stroke="#8297a4" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080,310 L1142,310" fill="none" stroke="#8297a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="63" y="508" width="502" height="216" rx="16" fill="#eef5f9" stroke="#cdd9e0"/><rect x="63" y="508" width="8" height="216" rx="4" fill="#4b829b"/><text x="87" y="552" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#283746">01 · Сохраняется черновик</text><text x="87" y="585" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Книги пишутся по главам в ai_book_chapters</text><text x="87" y="612" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Генерация и повторные попытки ограничены</text><text x="87" y="639" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Каждая стадия фиксирует входной SHA</text><text x="87" y="666" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Ошибка = остановка; текст не исчезает</text><rect x="615" y="508" width="502" height="216" rx="16" fill="#f7f3ea" stroke="#cdd9e0"/><rect x="615" y="508" width="8" height="216" rx="4" fill="#aa7e4e"/><text x="639" y="552" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#283746">02 · Проверяется предложение</text><text x="639" y="585" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Лексический QA → LLM-критик → редактор</text><text x="639" y="612" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Исходный текст остаётся неизменным</text><text x="639" y="639" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Предложения привязаны к точной цитате</text><text x="639" y="666" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Автор видит исходник и альтернативу</text><rect x="1167" y="508" width="455" height="216" rx="16" fill="#eef5f0" stroke="#cdd9e0"/><rect x="1167" y="508" width="8" height="216" rx="4" fill="#648b7d"/><text x="1191" y="552" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#283746">03 · Автор утверждает</text><text x="1191" y="585" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Проверка SHA старого текста</text><text x="1191" y="612" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Выбор редакции по главам</text><text x="1191" y="639" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">История отката в Canon</text><text x="1191" y="666" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607584">Релиз только после подтверждения</text><path d="M565,614 L613,614" fill="none" stroke="#8297a4" stroke-width="3" marker-end="url(#arrow)"/><path d="M1118,614 L1165,614" fill="none" stroke="#8297a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="76" y="789" width="1510" height="79" rx="14" fill="#e7edf2" stroke="none"/><text x="106" y="827" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334957">Правило целостности</text><text x="328" y="827" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#50697a">Ни один индекс, прогноз или LLM-ответ не переписывает авторскую рукопись сам.</text><text x="1630" y="928" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#7c8b94">ACHEWIW · схема проектной архитектуры · ноябрь 2026</text></svg>