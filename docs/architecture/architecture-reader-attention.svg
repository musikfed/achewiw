<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="1030" viewBox="0 0 1330 1030" role="img" aria-label="ACHEWIW — воронка внимания читателя"><defs><marker id="arrow" orient="auto" markerWidth="9" markerHeight="9" refX="7" refY="4"><path d="M0 0 L8 4 L0 8Z" fill="#899fac"/></marker></defs><rect width="1330" height="1030" fill="#f6f8f9"/><text x="70" y="84" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#2a3945">ПРОДОЛЖАЕМОЕ ВНИМАНИЕ · не клиффхэнгер ради клиффхэнгера</text><text x="70" y="121" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#2a3945">Проверяемая логика главы: вопрос ведёт к действию, а разгадка опирается на прежние улики.</text><rect x="70" y="164" width="1190" height="92" rx="18" fill="#fffdf5" stroke="#d8e0e5"/><text x="93" y="197" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2a3945">01 · Обещание читателю</text><text x="93" y="228" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#2a3945">Автор вводит цель героя и честный вопрос.</text><text x="1010" y="217" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#7d6b55">opening / tension 2</text><path d="M665 256 L665 270" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="101" y="270" width="1128" height="92" rx="18" fill="#fbfcfe" stroke="#d8e0e5"/><text x="124" y="303" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2a3945">02 · Попытка расследования</text><text x="124" y="334" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#2a3945">Герой проверяет след или гипотезу действием.</text><text x="979" y="323" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#7d6b55">development / tension 3</text><path d="M665 362 L665 376" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="132" y="376" width="1066" height="92" rx="18" fill="#f3f7fa" stroke="#d8e0e5"/><text x="155" y="409" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2a3945">03 · Улика и изменение риска</text><text x="155" y="440" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#2a3945">Новый факт меняет выбор или понимание мира.</text><text x="948" y="429" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#7d6b55">conflict / tension 4</text><path d="M665 468 L665 482" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="163" y="482" width="1004" height="92" rx="18" fill="#edf5f6" stroke="#d8e0e5"/><text x="186" y="515" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2a3945">04 · Проверка и переоценка</text><text x="186" y="546" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#2a3945">Ложный след опровергается по видимым причинам.</text><text x="917" y="535" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#7d6b55">reveal / partial</text><path d="M665 574 L665 588" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="194" y="588" width="942" height="92" rx="18" fill="#eaf2ec" stroke="#d8e0e5"/><text x="217" y="621" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2a3945">05 · Разгадка и решение</text><text x="217" y="652" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#2a3945">Подготовленная цепь улик получает объяснение.</text><text x="886" y="641" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#7d6b55">climax / full</text><path d="M665 680 L665 694" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><rect x="225" y="694" width="880" height="92" rx="18" fill="#e3eee8" stroke="#d8e0e5"/><text x="248" y="727" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2a3945">06 · Последствие и новая цель</text><text x="248" y="758" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#2a3945">Закрыть локальное дело; другая задача лишь по плану.</text><text x="855" y="747" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#7d6b55">resolution / aftermath</text><rect x="70" y="836" width="1190" height="101" rx="18" fill="#ebedf0" stroke="#d8e0e5"/><text x="92" y="872" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a3945">Проверка в ACHEWIW</text><text x="92" y="901" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">CPU сигналы → LLM-цитаты → факты RAG/StoryGraph → решение автора (не автоканон)</text><text x="70" y="983" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#2a3945">Обычные жанровые методы: детектив · проза · сериал. Никаких чужих сюжетов и обязательного шока в каждой главе.</text></svg>