<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="925" viewBox="0 0 1350 925" role="img" aria-label="ACHEWIW — воронка внимания читателя"><defs><marker id="arrow" orient="auto" markerWidth="9" markerHeight="9" refX="7" refY="4"><path d="M0 0 L8 4 L0 8Z" fill="#899fac"/></marker></defs><rect width="1350" height="925" fill="#f6f8f9"/><text x="62" y="75" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#2a3945">StoryGraph + RAG · обещания читателю</text><text x="62" y="110" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#2a3945">Авторский каркас — источник обязательств. Поисковый индекс не является доказательством канона.</text><rect x="65" y="160" width="340" height="140" rx="18" fill="#fff" stroke="#d8e0e5"/><text x="88" y="199" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a3945">Карточка главы</text><text x="88" y="240" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">hook · anchor · reader_info</text><text x="88" y="267" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">reader-engagement API</text><rect x="505" y="160" width="340" height="140" rx="18" fill="#fff" stroke="#d8e0e5"/><text x="528" y="199" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a3945">Открытый вопрос</text><text x="528" y="240" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">mystery / author-approved</text><text x="528" y="267" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Без выдуманной разгадки</text><rect x="945" y="160" width="340" height="140" rx="18" fill="#fff" stroke="#d8e0e5"/><text x="968" y="199" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a3945">Запланированный ответ</text><text x="968" y="240" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">reveal level: full</text><text x="968" y="267" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Только в назначенной главе</text><rect x="65" y="410" width="340" height="140" rx="18" fill="#fff" stroke="#d8e0e5"/><text x="88" y="449" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a3945">Улика в тексте</text><text x="88" y="490" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Действие → наблюдение</text><text x="88" y="517" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Дословная опора из главы</text><rect x="505" y="410" width="340" height="140" rx="18" fill="#fff" stroke="#d8e0e5"/><text x="528" y="449" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a3945">Проверка гипотезы</text><text x="528" y="490" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Обоснованное следствие</text><text x="528" y="517" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Ложный след → опровержение</text><rect x="945" y="410" width="340" height="140" rx="18" fill="#fff" stroke="#d8e0e5"/><text x="968" y="449" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a3945">Реальная развязка</text><text x="968" y="490" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Подтверждена цитатами</text><text x="968" y="517" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Литературный QA (гипотеза)</text><rect x="505" y="680" width="340" height="128" rx="18" fill="#fff" stroke="#d8e0e5"/><text x="528" y="719" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a3945">Итог автора</text><text x="528" y="760" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Принять или отклонить</text><text x="528" y="787" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Оригинал и ревизии в SQLite</text><path d="M405 223 L503 223" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M845 223 L943 223" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M237 302 L237 408" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M675 302 L675 408" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M1115 302 L1115 408" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M405 480 L503 480" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M845 480 L943 480" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><path d="M1115 550 L772 678" stroke="#899fac" stroke-width="2.8" fill="none" marker-end="url(#arrow)"/><text x="75" y="870" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#2a3945">Нет доказанной улики? Критик пишет «не найдено». Разгадка без подготовки получает замечание, а не статус «готово».</text></svg>