<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>08 · Чат редактуры — концептуальный макет, не рабочий скриншот</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#ffffff" stroke="none"/><rect x="0" y="0" width="1440" height="84" rx="0" fill="#ffffff" stroke="none"/><path d="M0 84H1440" stroke="#e7dfd4"/><text x="38" y="41" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" fill="#283139" font-weight="700">✦  A C H E W I W</text><text x="39" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#a07a4f" font-weight="400">Закулисная мастерская</text><rect x="1129" y="26" width="240" height="31" rx="15" fill="#f1e9da" stroke="none"/><text x="1144" y="48" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#614f37" font-weight="600">ПРОЕКТНЫЙ МАКЕТ</text><rect x="0" y="85" width="247" height="815" rx="0" fill="#f9f7f3" stroke="none"/><path d="M247 85V900" stroke="#e3d9cd"/><text x="30" y="133" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#987550" font-weight="700">МАСТЕРСКИЕ</text><text x="30" y="179" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#363b40" font-weight="400">✦ Фантастика и проза</text><text x="30" y="223" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#363b40" font-weight="400">▣ Технические книги</text><text x="30" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#363b40" font-weight="400">◈ Выступления</text><text x="30" y="311" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#363b40" font-weight="400">▤ Нонфикшн</text><text x="30" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#987550" font-weight="700">БИБЛИОТЕКА</text><rect x="16" y="415" width="214" height="62" rx="10" fill="#eee6db" stroke="#dacbb9"/><text x="32" y="450" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#3b332e" font-weight="600">Тестовое произведение</text><text x="289" y="138" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#967148" font-weight="700">ACHEWIW · ЕДИНОЕ ПРОИЗВЕДЕНИЕ</text><text x="287" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#2f3034" font-weight="400">08 · Чат редактуры</text><rect x="285" y="211" width="1127" height="52" rx="12" fill="#faf9f6" stroke="#e8ded2"/><text x="303" y="243" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#77736d" font-weight="400">01 Задание</text><text x="440" y="243" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#77736d" font-weight="400">02 План</text><text x="577" y="243" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#77736d" font-weight="400">03 Редактор</text><text x="714" y="243" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#77736d" font-weight="400">04 Иллюстрации</text><text x="851" y="243" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#77736d" font-weight="400">05 Проверка</text><text x="988" y="243" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#77736d" font-weight="400">06 Экспорт</text><text x="1125" y="243" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#77736d" font-weight="400">07 Чат</text><text x="1262" y="243" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#925e2e" font-weight="700">08 Редактура</text><rect x="299" y="291" width="170" height="31" rx="15" fill="#f0eadd" stroke="none"/><text x="314" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#614f37" font-weight="600">Одна глава</text><rect x="488" y="291" width="190" height="31" rx="15" fill="#e6eee9" stroke="none"/><text x="503" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#614f37" font-weight="600">Самостоятельно</text><rect x="1212" y="292" width="183" height="31" rx="15" fill="#f0efe8" stroke="none"/><text x="1227" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#614f37" font-weight="600">Ревизия: r01</text><rect x="286" y="350" width="355" height="413" rx="13" fill="#ffffff" stroke="#dfd4c7"/><rect x="656" y="350" width="356" height="413" rx="13" fill="#ffffff" stroke="#dfd4c7"/><rect x="1026" y="350" width="378" height="413" rx="13" fill="#fbfaf7" stroke="#dfd4c7"/><text x="310" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#33363c" font-weight="600">До · исходник</text><text x="680" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#33363c" font-weight="600">После · предложение</text><text x="1050" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#33363c" font-weight="600">Команда автора</text><text x="310" y="448" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#5d5047" font-weight="400">Я решил, что надо</text><text x="310" y="483" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#5d5047" font-weight="400">проверить все параметры.</text><text x="310" y="518" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#5d5047" font-weight="400">Я вам расскажу, как</text><text x="310" y="553" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#5d5047" font-weight="400">система устроена. Модель</text><text x="310" y="588" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#5d5047" font-weight="400">повторяет объяснение</text><text x="310" y="623" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#5d5047" font-weight="400">дважды и не даёт фактов.</text><rect x="679" y="417" width="310" height="216" rx="12" fill="#edf4ee" stroke="none"/><text x="696" y="448" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#284632" font-weight="400">Проверим параметры</text><text x="696" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#284632" font-weight="400">системы на конкретном</text><text x="696" y="512" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#284632" font-weight="400">примере. Сначала</text><text x="696" y="544" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#284632" font-weight="400">измерим задержку, затем</text><text x="696" y="576" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#284632" font-weight="400">сопоставим результаты</text><text x="696" y="608" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#284632" font-weight="400">с документацией.</text><rect x="1049" y="418" width="327" height="146" rx="12" fill="#f2eee7" stroke="none"/><text x="1066" y="450" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#514237" font-weight="400">Убери штампы и повторы.</text><text x="1066" y="479" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#514237" font-weight="400">Сохрани смысл, числа и</text><text x="1066" y="508" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#514237" font-weight="400">ссылки. Абзацы — по</text><text x="1066" y="537" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#514237" font-weight="400">ширине, без выдумок.</text><text x="1050" y="608" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#554a3b" font-weight="600">Область: глава 3</text><text x="1050" y="648" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#766b62" font-weight="400">Результат: только предложение</text><rect x="692" y="675" width="145" height="53" rx="9" fill="#343d43" stroke="none"/><text x="724" y="708" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="600">Принять</text><rect x="851" y="675" width="143" height="53" rx="9" fill="#ffffff" stroke="#c6b49d"/><text x="876" y="708" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#544538" font-weight="600">Отклонить</text><rect x="287" y="788" width="1117" height="75" rx="11" fill="#f8f5f0" stroke="#e0d6c9"/><text x="307" y="819" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#5b5148" font-weight="400">Макет будущей редакторской вкладки: изменения предлагаются по фрагментам.</text><text x="307" y="846" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#5b5148" font-weight="400">Оригинал сохраняется, новая редакция появляется только после утверждения автора.</text></svg>