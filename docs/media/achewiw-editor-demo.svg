<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Рабочая книга / демонстрация">
  <rect width="1600" height="900" fill="#f8f6f1"/><rect x="0" y="0" width="1600" height="78" rx="0" fill="#fff" stroke="none"/><text x="28" y="50" font-family="Arial, sans-serif" font-size="35" fill="#a67b48" font-weight="400" >✦</text><text x="78" y="46" font-family="Arial, sans-serif" font-size="25" fill="#2e3540" font-weight="700" >A C H E W I W</text><text x="80" y="65" font-family="Arial, sans-serif" font-size="11" fill="#ab9181" font-weight="400" >Типография в кармане</text><rect x="1332" y="20" width="237" height="34" rx="17" fill="#f6f0e7" stroke="none"/><text x="1347" y="43" font-family="Arial, sans-serif" font-size="15" fill="#967045" font-weight="600" >Рабочая книга / демонстрация</text><rect x="0" y="78" width="262" height="822" rx="0" fill="#fff" stroke="#e9e3d8"/><text x="24" y="127" font-family="Arial, sans-serif" font-size="14" fill="#977147" font-weight="700" >МАСТЕРСКИЕ</text><text x="24" y="184" font-family="Arial, sans-serif" font-size="17" fill="#313942" font-weight="400" >✦  Фантастика и проза</text><text x="24" y="239" font-family="Arial, sans-serif" font-size="17" fill="#313942" font-weight="400" >▣  Технические книги</text><text x="24" y="294" font-family="Arial, sans-serif" font-size="17" fill="#313942" font-weight="400" >◇  Выступления</text><text x="24" y="349" font-family="Arial, sans-serif" font-size="17" fill="#313942" font-weight="400" >▤  Нонфикшн</text><rect x="16" y="380" width="230" height="49" rx="10" fill="#f4ece1" stroke="none"/><text x="30" y="412" font-family="Arial, sans-serif" font-size="17" fill="#765532" font-weight="700" >Все произведения</text><path d="M20 460 H243" stroke="#e9e1d5"/><text x="22" y="496" font-family="Arial, sans-serif" font-size="13" fill="#92795a" font-weight="700" >БИБЛИОТЕКА</text><rect x="17" y="516" width="229" height="74" rx="10" fill="#f5eee3" stroke="none"/><text x="30" y="544" font-family="Arial, sans-serif" font-size="18" fill="#3a3936" font-weight="700" >Северный маяк</text><text x="30" y="572" font-family="Arial, sans-serif" font-size="14" fill="#998c7a" font-weight="400" >Фантастика · образец</text><path d="M20 791 H243" stroke="#e9e1d5"/><text x="22" y="829" font-family="Arial, sans-serif" font-size="12" fill="#ad977f" font-weight="700" >ACHEWIW · ИЗДАНИЕ</text><text x="22" y="855" font-family="Arial, sans-serif" font-size="12" fill="#a19385" font-weight="400" >Идея → каркас → текст → книга</text>
  <text x="1395" y="105" font-family="Arial, sans-serif" font-size="11" fill="#b4a79a" font-weight="700" >ДЕМОНСТРАЦИОННЫЙ МАКЕТ</text>
  <text x="331" y="154" font-family="Arial, sans-serif" font-size="15" fill="#a67c4b" font-weight="700" >СТУДИЯ ФАНТАСТИКИ / ДЕМОНСТРАЦИЯ</text><text x="330" y="222" font-family="Arial, sans-serif" font-size="52" fill="#343b43" font-weight="400" >Северный маяк</text><text x="332" y="257" font-family="Arial, sans-serif" font-size="18" fill="#90877d" font-weight="400" >Канон мира, главы и редакционные решения — под контролем автора.</text><rect x="335" y="301" width="170" height="34" rx="17" fill="#333e47" stroke="none"/><text x="350" y="324" font-family="Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" >01 · Задание</text><rect x="525" y="301" width="153" height="34" rx="17" fill="#f1e8db" stroke="none"/><text x="540" y="324" font-family="Arial, sans-serif" font-size="15" fill="#906a40" font-weight="600" >02 · Каркас</text><rect x="696" y="301" width="164" height="34" rx="17" fill="#f1e8db" stroke="none"/><text x="711" y="324" font-family="Arial, sans-serif" font-size="15" fill="#906a40" font-weight="600" >03 · Редактор</text><rect x="878" y="301" width="169" height="34" rx="17" fill="#f1e8db" stroke="none"/><text x="893" y="324" font-family="Arial, sans-serif" font-size="15" fill="#906a40" font-weight="600" >04 · Рисунки</text><rect x="1065" y="301" width="144" height="34" rx="17" fill="#f1e8db" stroke="none"/><text x="1080" y="324" font-family="Arial, sans-serif" font-size="15" fill="#906a40" font-weight="600" >05 · QA</text><rect x="1223" y="301" width="202" height="34" rx="17" fill="#f1e8db" stroke="none"/><text x="1238" y="324" font-family="Arial, sans-serif" font-size="15" fill="#906a40" font-weight="600" >06 · Типография</text><path d="M334 359 H1545" stroke="#e9e1d5"/><text x="335" y="413" font-family="Arial, sans-serif" font-size="32" fill="#313942" font-weight="400" >Редакционное задание</text><text x="335" y="443" font-family="Arial, sans-serif" font-size="17" fill="#978e84" font-weight="400" >Текущая книга — только демонстрационный пример интерфейса.</text><rect x="334" y="472" width="594" height="100" rx="14" fill="#fff" stroke="#e3dcd1"/><text x="356" y="500" font-family="Arial, sans-serif" font-size="14" fill="#9f7d57" font-weight="700" >НАЗВАНИЕ</text><text x="356" y="539" font-family="Arial, sans-serif" font-size="22" fill="#313942" font-weight="400" >Северный маяк</text><rect x="952" y="472" width="582" height="100" rx="14" fill="#fff" stroke="#e3dcd1"/><text x="974" y="500" font-family="Arial, sans-serif" font-size="14" fill="#9f7d57" font-weight="700" >ЖАНР</text><text x="974" y="539" font-family="Arial, sans-serif" font-size="22" fill="#313942" font-weight="400" >Научная фантастика</text><rect x="334" y="592" width="1200" height="165" rx="14" fill="#fff" stroke="#e3dcd1"/><text x="356" y="624" font-family="Arial, sans-serif" font-size="14" fill="#9f7d57" font-weight="700" >ЗАМЫСЕЛ И КОНФЛИКТ</text><text x="356" y="665" font-family="Arial, sans-serif" font-size="19" fill="#313942" font-weight="400" >На удалённой станции перестал работать маяк.</text><text x="356" y="696" font-family="Arial, sans-serif" font-size="19" fill="#313942" font-weight="400" >Инженер ищет причину сигнала, пока город теряет связь.</text><text x="356" y="728" font-family="Arial, sans-serif" font-size="17" fill="#938a80" font-weight="400" >Все изменения сюжета проходят через авторское утверждение.</text><rect x="334" y="785" width="185" height="34" rx="17" fill="#333e47" stroke="none"/><text x="349" y="808" font-family="Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" >Сохранить задание</text></svg>