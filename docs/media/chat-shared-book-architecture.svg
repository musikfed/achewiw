<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><title>Архитектура единого состояния ACHEWIW — проектная схема</title><rect x="0" y="0" width="1440" height="850" rx="0" fill="#fff" stroke="none"/><text x="75" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#333a40" font-weight="600">ACHEWIW · Единое состояние произведения</text><text x="77" y="123" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#7a6c60" font-weight="400">Схема архитектуры (планируемые 07/08, существующие 01–06)</text><rect x="382" y="177" width="685" height="121" rx="18" fill="#f1eadf" stroke="#ac8f6c"/><text x="470" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#493c30" font-weight="700">КАНОНИЧЕСКОЕ СОСТОЯНИЕ КНИГИ</text><text x="453" y="249" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#61564b" font-weight="400">Project · ТЗ · каркас · главы · авторский канон · источники</text><text x="453" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#61564b" font-weight="400">ревизии · изображения · версии выпуска · SQLite</text><path d="M716 299V365" stroke="#a98b68" stroke-width="4"/><path d="M705 350L716 365L727 350" stroke="#a98b68" stroke-width="4" fill="none"/><rect x="80" y="395" width="590" height="185" rx="16" fill="#eef2ee" stroke="#b7c8bc"/><rect x="770" y="395" width="590" height="185" rx="16" fill="#f7f1e8" stroke="#d9c6ae"/><text x="114" y="437" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#2d4c39" font-weight="700">07 · ЧАТ ГЕНЕРАЦИИ</text><text x="114" y="477" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#395647" font-weight="400">Разговор → ТЗ → предложение каркаса</text><text x="114" y="508" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#395647" font-weight="400">Задания генерации, пауза и продолжение</text><text x="114" y="539" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#395647" font-weight="400">Черновик отдельно → утверждение автором</text><text x="805" y="437" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#775631" font-weight="700">08 · ЧАТ РЕДАКТУРЫ</text><text x="805" y="477" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#695641" font-weight="400">Свободный запрос → анализ поручения</text><text x="805" y="508" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#695641" font-weight="400">Предложение правок → diff → согласование</text><text x="805" y="539" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#695641" font-weight="400">Новая ревизия + откат без потери оригинала</text><path d="M380 395L500 348H716M1060 395L939 348H716" fill="none" stroke="#b19b80" stroke-width="3"/><path d="M715 580V624" stroke="#9c8b75" stroke-width="3"/><rect x="120" y="634" width="1200" height="117" rx="13" fill="#f6f6f4" stroke="#dcd6cb"/><text x="157" y="678" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#3c4245" font-weight="600">01 Задание     02 План     03 Редактор     04 Иллюстрации     05 Проверка     06 Экспорт</text><text x="157" y="713" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#7b6958" font-weight="400">Вкладки видят только утверждённые версии; черновики и предложения не меняют канон</text><text x="121" y="806" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#5a665b" font-weight="400">Внешние DOCX/PDF → независимый DOCWORK → общий протокол ревизий и приёмки</text></svg>