name: ACHEWIW chat studio UI
on:
  pull_request:
    paths:
      - 'app/static/index.html'
      - 'app/static/chat_studio.js'
      - 'app/static/style.css'
      - 'app/static/app.js'
      - 'app/main.py'
      - 'app/chat_api.py'
      - 'app/chat_linked_edits.py'
      - 'tests/test_chat_studio_ui.py'
      - 'scripts/verify-versioned-assets.py'
      - '.github/workflows/chat-studio-ui.yml'
  workflow_dispatch:
jobs:
  chat-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app dependencies
        run: pip install -r app/requirements.txt
      - name: Verify javascript syntax and clean-update assets
        run: |
          node --check app/static/chat_studio.js
          node --check app/static/app.js
          python scripts/verify-versioned-assets.py
      - name: Verify eight tabs, history and pending diff
        run: python -m unittest discover -s tests -p 'test_chat_studio_ui.py' -v
      - name: Guard model and editor API regression
        run: |
          python -m unittest discover -s tests -p 'test_chat_ollama_editor.py' -v
          python -m unittest discover -s tests -p 'test_chat_editorial_api.py' -v
