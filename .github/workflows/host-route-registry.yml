name: ACHEWIW actual API route registry diagnostic
on:
  pull_request:
    paths:
      - 'tests/test_live_route_registry.py'
      - '.github/workflows/host-route-registry.yml'
      - 'app/main.py'
  workflow_dispatch:
jobs:
  exact-router-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_live_route_registry.py' -v
