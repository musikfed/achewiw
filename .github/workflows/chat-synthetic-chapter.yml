name: ACHEWIW synthetic chapter review
on:
  pull_request:
    paths:
      - 'app/chat_synthetic_editor.py'
      - 'tests/test_chat_synthetic_editor.py'
      - '.github/workflows/chat-synthetic-chapter.yml'
  workflow_dispatch:
jobs:
  synthetic-chapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic chapter checks (no server or GPU)
        run: python -m unittest discover -s tests -p 'test_chat_synthetic_editor.py' -v
