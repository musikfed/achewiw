name: ACHEWIW lifecycle isolation

on:
  push:
    branches:
      - main
      - feature/technical-epub-first
      - feature/production-conveyor-rtx3060
  pull_request:

permissions:
  contents: read

jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shutdown script syntax
        run: bash -n scripts/achewiw-control.sh scripts/prune-legacy-branches.sh
      - name: Simulated Docker isolation tests
        run: python3 -m unittest discover -v -s tests -p 'test_achewiw_control.py'
      - name: Validate safe editorial-only update script
        run: bash -n scripts/update-editorial.sh scripts/update-studio-clean.sh scripts/monitor-v2.sh scripts/reinstall-studio-fresh.sh
      - name: Validate loopback ComfyUI host-control bridge
        run: |
          bash -n scripts/comfyui-control-agent.sh
          python3 -m unittest discover -v -s tests -p 'test_comfyui_control_agent.py'
          grep -Fq '127.0.0.1' scripts/comfyui_control_agent.py
      - name: Optional ComfyUI RTX3060 runner is isolated and syntax-safe
        run: |
          bash -n scripts/comfyui-local.sh
          python3 -m unittest discover -v -s tests -p 'test_comfyui_local.py'
          grep -Fq "CUDA12.4" scripts/comfyui-local.sh
          grep -Fq '127.0.0.1' scripts/comfyui-local.sh
          grep -Fq 'model-sdxl' docs/COMFYUI-RTX3060-RU.md
      - name: Reproduce linked Ubuntu systemd user-unit and isolation checks
        run: python3 -m unittest discover -v -s tests -p 'test_monitor_v2_service.py'
      - name: Editorial layout, responsive rules and versioned assets
        run: python3 -m unittest discover -v -s tests -p 'test_editorial_layout.py'
      - name: Validate browser application and monitoring JS syntax
        run: |
          node --check app/static/app.js
          node --check app/static/monitor.js
          node --check app/static/illustrations.js
          node --check app/static/writing_blocks.js
          grep -Fq 'id="aiProgress"' app/static/index.html
          grep -Fq 'id="unloadModel"' app/static/index.html
      - name: Check compose ownership markers
        run: |
          grep -Fq 'org.achewiw.lifecycle: "managed"' compose.yaml
          grep -Fq 'org.achewiw.workspace: "/1tbdisk/achewiw"' compose.yaml
      - name: Validate Python monitor syntax
        run: python3 -m py_compile scripts/comfyui_control_agent.py scripts/achewiw_host_monitor.py app/monitoring_core.py app/generation_core.py app/book_generation_core.py app/book_rag_pipeline.py app/editorial_review.py app/visual_puzzles.py app/book_layout_core.py app/editor_workspace.py app/chapter_planning.py app/story_memory.py app/editorial_ledger.py app/manuscript_core.py app/publishing_exports.py scripts/story-storage-maintenance.py scripts/library_admin.py app/illustrations_core.py app/image_engine.py app/gpu_scheduling.py app/writing_blocks_core.py scripts/erase-studio-library.py app/main.py
      - name: Read-only host metrics parsing tests
        run: python3 -m unittest discover -v -s tests -p 'test_*monitor*.py'
      - name: Durable SQLite generation jobs safety tests
        run: python3 -m unittest discover -v -s tests -p 'test_generation_core.py'
      - name: Real manuscript Markdown/EPUB & QA persistence unit tests
        run: python3 -m unittest discover -v -s tests -p 'test_manuscript_core.py'
      - name: Verify new book and author-choice elements
        run: |
          grep -Fq 'data-tab="book"' app/static/index.html
          grep -Fq 'id="bookPreview"' app/static/index.html
          grep -Fq 'id="bookDraftPreview"' app/static/index.html
          grep -Fq 'id="bookGenerate"' app/static/index.html
          grep -Fq 'id="generateFullBook"' app/static/index.html
          grep -Fq 'id="resumeFullBook"' app/static/index.html
          grep -Fq 'id="acceptFullBook"' app/static/index.html
          grep -Fq 'id="auditReview"' app/static/index.html
          grep -Fq 'id="saveAuditDecision"' app/static/index.html
      - name: Install FastAPI and HTTPX for isolated API tests
        run: python3 -m pip install --disable-pip-version-check -r app/requirements.txt pytest
      - name: Compile production conveyor and check browser JavaScript
        run: |
          python3 -m compileall -q app
          node --check app/static/conveyor.js
      - name: ACHEWIW production state and renewable GPU leases
        run: PYTHONPATH=app python3 -m pytest -q tests/test_conveyor_core.py tests/test_conveyor_api.py tests/test_release_gate_core.py tests/test_landing_page.py
      - name: API generation, restart recovery, model-unload and auth tests
        run: PYTHONPATH=app python3 -m pytest -q tests/test_editor_workspace.py tests/test_edition_storage.py tests/test_app.py tests/test_book_generation_core.py tests/test_book_repetition_recovery.py tests/test_book_resumable_navigation.py tests/test_book_hybrid_rag.py tests/test_chapter_planning.py tests/test_story_memory.py tests/test_editorial_ledger.py
      - name: Sequential GPU operations, optional Ollama-to-SDXL prompt and safe browser refresh
        run: |
          PYTHONPATH=app python3 -m pytest -q tests/test_gpu_scheduling.py
          grep -Fq '20261105-editorial-v19' app/static/index.html
          grep -Fq 'rebuild-fresh' scripts/achewiw-control.sh
      - name: Persistent author-approved story blocks and continuity QA
        run: |
          PYTHONPATH=app python3 -m pytest -q tests/test_writing_blocks.py
          grep -Fq 'id="writingBlockList"' app/static/index.html
          grep -Fq 'id="runContinuity"' app/static/index.html
          grep -Fq 'id="polishScene"' app/static/index.html
      - name: Real book illustrations, local image-engine selection and safe isolated wipe
        run: |
          PYTHONPATH=app python3 -m pytest -q tests/test_illustrations.py tests/test_fresh_library_reset.py
          grep -Fq 'id="illustrationGrid"' app/static/index.html
          grep -Fq 'id="illustrationEnginePrepare"' app/static/index.html
          grep -Fq 'id="openTypography"' app/static/index.html
          grep -Fq 'id="bookPrint"' app/static/index.html
      - name: Validate full typing and export controls
        run: |
          grep -Fq 'data-kind-filter="technical"' app/static/index.html
          grep -Fq 'data-kind-filter="speech"' app/static/index.html
          grep -Fq 'id="bookPrint"' app/static/index.html
          grep -Fq 'id="bookDocx"' app/static/index.html
          grep -Fq 'org.achewiw.workspace' compose.yaml
          ! grep -Fq 'ACHEWIW_PASSWORD:' compose.yaml
      - name: Install free Cyrillic fonts for PDF tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - name: Real publishing artifacts, genres and safe data reset
        run: |
          PYTHONPATH=app python3 -m pytest -q tests/test_publishing_exports.py tests/test_book_editorial_release.py
          PYTHONPATH=app python3 -m pytest -q tests/test_app.py
      - name: Check user systemd telemetry ownership
        run: |
          grep -Fq 'WorkingDirectory=/1tbdisk/achewiw' ops/achewiw-host-monitor.service
          grep -Fq '/1tbdisk/achewiw/scripts/achewiw_host_monitor.py' ops/achewiw-host-monitor.service
