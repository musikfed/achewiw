name: ACHEWIW lifecycle isolation

on:
  push:
    branches:
      - feature/technical-epub-first
  pull_request:

permissions:
  contents: read

jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shutdown script syntax
        run: bash -n scripts/achewiw-control.sh
      - name: Simulated Docker isolation tests
        run: python3 -m unittest discover -v -s tests -p 'test_achewiw_control.py'
      - name: Validate browser application and monitoring JS syntax
        run: |
          node --check app/static/app.js
          node --check app/static/monitor.js
          grep -Fq 'id="aiProgress"' app/static/index.html
          grep -Fq 'id="unloadModel"' app/static/index.html
      - name: Check compose ownership markers
        run: |
          grep -Fq 'org.achewiw.lifecycle: "managed"' compose.yaml
          grep -Fq 'org.achewiw.workspace: "/1tbdisk/achewiw"' compose.yaml
      - name: Validate Python monitor syntax
        run: python3 -m py_compile scripts/achewiw_host_monitor.py app/monitoring_core.py app/generation_core.py app/main.py
      - name: Read-only host metrics parsing tests
        run: python3 -m unittest discover -v -s tests -p 'test_*monitor*.py'
      - name: Durable SQLite generation jobs safety tests
        run: python3 -m unittest discover -v -s tests -p 'test_generation_core.py'
      - name: Install FastAPI and HTTPX for isolated API tests
        run: python3 -m pip install --disable-pip-version-check -r app/requirements.txt pytest
      - name: API generation, restart recovery, model-unload and auth tests
        run: PYTHONPATH=app python3 -m pytest -q tests/test_app.py
      - name: Check user systemd telemetry ownership
        run: |
          grep -Fq 'WorkingDirectory=/1tbdisk/achewiw' ops/achewiw-host-monitor.service
          grep -Fq '/1tbdisk/achewiw/scripts/achewiw_host_monitor.py' ops/achewiw-host-monitor.service
